name: CI build
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "mainline" ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ "mainline" ]
    paths-ignore:
      - '*.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
