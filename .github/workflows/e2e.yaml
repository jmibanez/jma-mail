name: E2E
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ "mainline" ]
    paths-ignore:
      - '*.md'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ "mainline" ]
    paths-ignore:
      - '*.md'
      - '.github/workflows/ci.yaml'

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Pre-pull Stalwart image
      # Pulls happen serially inside testcontainers otherwise; doing
      # it up front lets the cargo build phase overlap network with
      # compilation.
      run: docker pull stalwartlabs/stalwart:v0.16
    - name: Run E2E tests
      run: cargo test --test 'e2e_*' -- --ignored --nocapture
