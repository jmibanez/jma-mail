[package]
name = "jmapsync"
version = "0.1.0"
edition = "2024"
description = "Bidirectional JMAP-to-Maildir email sync for Fastmail"

[dependencies]
# JMAP client
jmap-client = { version = "0.4", default-features = false, features = ["async", "ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP (for blob downloads and raw requests)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# State DB
rusqlite = { version = "0.31", features = ["bundled"] }

# Maildir
maildir = "0.6"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Paths
dirs = "5"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# SSE for JMAP push
reqwest-eventsource = "0.6"
futures-util = "0.3"

# Filesystem watcher for daemon mode
notify = "8"
notify-debouncer-mini = "0.7"

# OS-native secret storage for the bearer token. The keyring ecosystem
# split in v4: `keyring-core` is the cross-platform API (Entry, Error,
# default-store registry); platform backends are separate crates and
# pulled in via target-cfg, so each OS only compiles its own backend.
# A backend must be registered via `keyring_core::set_default_store`
# before any Entry is created — see `src/auth.rs::init_store`.
keyring-core = "1"

# Hidden TTY prompt for `auth set-token`
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `crypto-rust` avoids an OpenSSL dep; `vendored` builds D-Bus
# from source to ease cross-distro use.
dbus-secret-service-keyring-store = { version = "1", features = [
    "crypto-rust",
    "vendored",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
