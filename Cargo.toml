[package]
name = "jma-mail"
version = "0.9.1"
edition = "2024"
description = "JM's Mail Agent: bidirectional JMAP-to-Maildir email sync"
repository = "https://github.com/jmibanez/jma-mail"
license = "BSD-3-Clause"

[[bin]]
name = "jma"
path = "src/main.rs"

[dependencies]
# JMAP client
jmap-client = { version = "0.4", default-features = false, features = ["async", "ring"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP (for blob downloads and raw requests)
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive", "wrap_help"] }

# State DB
rusqlite = { version = "0.31", features = ["bundled"] }

# Cross-platform advisory file lock (flock / LockFileEx) used by both
# `maildir_ops::lock::acquire_lock` (per-maildir) and
# `state::db::acquire_lock` (per-state-DB).
fd-lock = "4"

# Maildir. staktrace/maildir#45 (`store_new_with_flags` + suffix-aware
# iteration of `new/`) has merged upstream but no crates.io release
# has shipped yet, and we also have forked this crate to avoid
# F_FULLFSYNC on macOS; pin to a commit on our fork that contains both
# the upstream and our fsync change.
maildir = { git = "https://github.com/jmibanez/maildir", rev = "0d34d4d78e61acedbfc3385a85169cf2498f4a84", features = ["barrier_fsync"] }

# RFC 5322 header parsing. Already pulled in transitively via the
# maildir crate (which uses it for `MailEntry::headers()`); declare
# it directly so `parse_message_id_from_file` can call
# `mailparse::parse_headers` on a bounded buffer instead of routing
# through `MailEntry`, which would force a full-file read just to
# pull one header.
mailparse = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Paths
dirs = "5"

# Unique IDs
uuid = { version = "1", features = ["v4"] }

# Random jitter for JMAP retry backoff. Already pulled in transitively
# (e.g. via uuid); declared directly so retry.rs can call
# `rand::rng().random_range(...)` without sneaking through a re-export.
rand = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# SSE for JMAP push
reqwest-eventsource = "0.6"
futures-util = "0.3"

# Streaming SHA-256 for `janitor::remotededupe`'s content-equality
# check. Already in the dependency tree transitively (TLS stack);
# declare directly so the dedupe planner can hash a blob without
# buffering it in full.
sha2 = "0.10"

# DNS SRV lookup for JMAP autodiscovery (RFC 8620 section 2.2).
# `tokio` enables the async runtime; `system-config` lets the
# resolver pick up /etc/resolv.conf (or the Windows registry) so it
# routes through the same recursive resolver the rest of the system
# uses. We don't need DoH/DoT/DNSSEC features here.
hickory-resolver = { version = "0.26", default-features = false, features = [
    "tokio",
    "system-config",
] }

# Filesystem watcher for daemon mode
notify = "8"
notify-debouncer-mini = "0.7"

# OS-native secret storage for the bearer token. The keyring ecosystem
# split in v4: `keyring-core` is the cross-platform API (Entry, Error,
# default-store registry); platform backends are separate crates and
# pulled in via target-cfg, so each OS only compiles its own backend.
# A backend must be registered via `keyring_core::set_default_store`
# before any Entry is created — see `src/auth.rs::init_store`.
keyring-core = "1"

# Interactive prompts for the first-run wizard and `jma auth
# set-token`. `Input`/`Password` cover text and hidden inputs;
# `Select` is the arrow-key chooser used for the wizard's layout
# and conflict-strategy questions. Only the `password` feature is
# enabled; if you ever reach for `dialoguer::Editor`, add `editor`
# (which pulls in `tempfile` transitively).
dialoguer = { version = "0.11", default-features = false, features = ["password"] }

# Regex for pattern-based maildir rename rules
regex = "1.12"

# `getrusage` for per-phase peak-RSS sampling in the profile layer.
# Already pulled in transitively (e.g. via tokio); declared directly
# so `profile::rss_sampler` can call `libc::getrusage` without
# routing through a re-export.
libc = "0.2"

# TUI for `jma watch`. ratatui owns the layout/render primitives;
# crossterm is its backend (raw mode, alt screen, key events). Only
# the watch command activates the TUI -- one-shot sync still prints
# plain text -- so these are unconditional deps but the runtime cost
# is paid only when `jma watch` is interactive.
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
# `crypto-rust` avoids an OpenSSL dep; `vendored` builds D-Bus
# from source to ease cross-distro use.
dbus-secret-service-keyring-store = { version = "1", features = [
    "crypto-rust",
    "vendored",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# In-process HTTP mock server for integration tests that exercise the
# JMAP HTTP plumbing (e.g. retry behavior on 503).
wiremock = "0.6"
# Spawn an ephemeral Stalwart Mail container per E2E suite so we can
# exercise the JMAP path against a real server instead of scripted
# wiremock fixtures. Default `ring` TLS feature matches the rest of
# our build; we don't need `http_wait` or `blocking`.
testcontainers = "0.27"
# Out-of-band seeding into the test Stalwart: APPEND synthetic
# messages into the test account's INBOX without going through the
# same JMAP path we're testing. A jmap-client breakage shouldn't
# make seeding silently produce bad fixtures.
async-imap = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
] }
# Synthetic corpus generation for the bench examples
# (examples/gen-bench-maildir). Names, lorem-ipsum bodies, varied
# subject lines; size distribution is driven by sentence/paragraph
# range arguments so the bench can exercise non-uniform message
# sizes. Dev-only because no production code path constructs fake
# email content.
fake = "4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
